name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown content
        run: npm run lint:markdown

      - name: Check markdown links (internal + external)
        env:
          STRICT_EXTERNAL_LINKS: 'true'
        run: npm run check:links

      - name: Build site
        run: npm run build
